services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nebula-console:local
    restart: unless-stopped
    init: true
    env_file:
      - ${NEBULA_ENV_FILE:-.env}
    ports:
      - "${NEBULA_HTTP_PORT:-3000}:3000"
    volumes:
      - nebula-cache:/var/lib/nebula/cache
    tmpfs:
      - /tmp:size=4g,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  nebula-cache:
